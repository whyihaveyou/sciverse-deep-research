[project]
name = "sciverse-survey-gates"
version = "0.1.0"
description = "MCP server exposing sciverse-deep-research 综述管线的机械门禁（台账 validate / compile / 交付 check / Crossref 题录核验）"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4.5",
    "mcp>=1.2.0",
]

[project.scripts]
sciverse-survey-gates = "sciverse_survey_gates.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sciverse_survey_gates"]
